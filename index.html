<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Critical image preload -->
    <link
      rel="preload"
      as="image"
      href="/images/arafam-hero-portrait.jpeg"
      fetchpriority="high"
    />

    <!-- Primary SEO metadata -->
    <title>Arafam Silla | Frontend Developer & React Developer</title>
    <meta
      name="description"
      content="Explore Arafam Silla's portfolio: a frontend developer building responsive, accessible and modern web applications with React and JavaScript."
    />

    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://arafam.dev/" />

    <!-- Brand icons -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Arafam.dev" />
    <meta property="og:title" content="Arafam Silla | Frontend Developer" />
    <meta
      property="og:description"
      content="Discover my React projects and modern web experiences. Built with a focus on design, accessibility and performance."
    />
    <meta property="og:url" content="https://arafam.dev/" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:image" content="https://arafam.dev/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Arafam Silla — Frontend Developer. Building digital experiences with React."
    />

    <!-- Social sharing -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Arafam Silla | Frontend Developer" />
    <meta
      name="twitter:description"
      content="Frontend Developer specializing in React, JavaScript and modern web experiences."
    />
    <meta name="twitter:image" content="https://arafam.dev/og-image.png" />
    <meta
      name="twitter:image:alt"
      content="Arafam Silla — Frontend Developer. Building digital experiences with React."
    />
  </head>
